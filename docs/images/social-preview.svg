<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc3ff"/>
      <stop offset="1" stop-color="#1d9bf0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22303c"/>
      <stop offset="1" stop-color="#0b0f13"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.22" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#1d9bf0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1d9bf0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>

  <!-- App icon: the original rounded "X" letter (not X Corp's logo). 1024 grid scaled to 300 px. -->
  <g transform="translate(86 170) scale(0.3125) translate(-100 -100)" filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
    <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="8"/>
    <g stroke="#1d9bf0" stroke-opacity="0.55" stroke-width="150" stroke-linecap="round" filter="url(#glow)">
      <line x1="355" y1="355" x2="669" y2="669"/>
      <line x1="669" y1="355" x2="355" y2="669"/>
    </g>
    <line x1="669" y1="355" x2="355" y2="669" stroke="url(#accent)" stroke-width="118" stroke-linecap="round"/>
    <line x1="355" y1="355" x2="669" y2="669" stroke="#fff" stroke-width="118" stroke-linecap="round"/>
  </g>

  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="440" y="250" font-size="82" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Twitter Desktop</text>
    <text x="442" y="310" font-size="34" font-weight="500" fill="#8fa3b3">Client macOS open source pour X</text>

    <!-- Trust badges -->
    <g font-size="26" font-weight="600" fill="#e6eef5">
      <g transform="translate(442 360)">
        <rect width="292" height="58" rx="29" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <circle cx="30" cy="29" r="8" fill="#3ddc97"/>
        <text x="52" y="38">Code vérifiable</text>
      </g>
      <g transform="translate(752 360)">
        <rect width="292" height="58" rx="29" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <circle cx="30" cy="29" r="8" fill="#3ddc97"/>
        <text x="52" y="38">Aucune télémétrie</text>
      </g>
      <g transform="translate(442 436)">
        <rect width="292" height="58" rx="29" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <circle cx="30" cy="29" r="8" fill="#3ddc97"/>
        <text x="52" y="38">Licence MIT</text>
      </g>
      <g transform="translate(752 436)">
        <rect width="292" height="58" rx="29" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <circle cx="30" cy="29" r="8" fill="#3ddc97"/>
        <text x="52" y="38">DMG attesté</text>
      </g>
    </g>

    <text x="442" y="560" font-size="22" fill="#6c7f8f">Projet non officiel, sans lien avec X Corp.</text>
  </g>
</svg>
